<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meus Pedidos — Dona Benta</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="css/style.css">
<style>
  .pedido-cartao {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 20px;
    align-items: center;
    padding: 20px;
    margin-bottom: 16px;
  }
  @media (max-width: 700px) {
    .pedido-cartao { grid-template-columns: 1fr; text-align: left; }
  }
  .pedido-icone {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--azul-bebe);
    display: flex; align-items: center; justify-content: center;
    color: var(--marrom);
  }
  .pedido-numero { font-weight: 700; color: var(--marrom); margin-bottom: 4px; }
  .pedido-detalhes { font-size: 0.85rem; color: var(--marrom-claro); }
  .pedido-itens-mini { font-size: 0.85rem; color: var(--marrom-claro); margin-top: 4px; }
  .pedido-lado-direito { text-align: right; }
  @media (max-width: 700px) { .pedido-lado-direito { text-align: left; } }
  .pedido-preco { font-family: var(--fonte-display); font-weight: 700; color: var(--dourado-escuro); font-size: 1.1rem; margin-bottom: 8px; }
</style>
</head>
<body>

<section class="pagina-header">
  <div class="container">
    <span class="eyebrow">Histórico</span>
    <h1>Meus pedidos</h1>
    <p>Acompanhe o status dos seus pedidos anteriores.</p>
  </div>
</section>

<div class="container secao">
  <div id="areaPedidos">
    <div class="spinner"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/layout.js"></script>
<script>
const STATUS_INFO = {
  aguardando_confirmacao: { rotulo: 'Aguardando confirmação', classe: 'badge-alerta', icone: 'hourglass_empty' },
  confirmado: { rotulo: 'Confirmado', classe: 'badge-info', icone: 'check_circle' },
  em_preparo: { rotulo: 'Em preparo', classe: 'badge-info', icone: 'skillet' },
  pronto: { rotulo: 'Pronto', classe: 'badge-sucesso', icone: 'inventory' },
  entregue: { rotulo: 'Entregue', classe: 'badge-sucesso', icone: 'done_all' },
  cancelado: { rotulo: 'Cancelado', classe: 'badge-erro', icone: 'cancel' },
};

async function carregarPedidos() {
  const area = document.getElementById('areaPedidos');
  const usuario = await exigirLogin('login.html');
  if (!usuario) return;

  let pedidos = [];
  try {
    const { data, error } = await db
      .from('pedidos')
      .select('*')
      .eq('cliente_id', usuario.id)
      .order('criado_em', { ascending: false });
    if (!error && data) pedidos = data;
  } catch (e) {
    console.warn('Supabase ainda não configurado.');
  }

  if (pedidos.length === 0) {
    area.innerHTML = `
      <div class="vazio">
        <span class="material-symbols-outlined">receipt_long</span>
        <h3>Você ainda não fez nenhum pedido</h3>
        <p>Explore o catálogo e faça sua primeira encomenda.</p>
        <a href="catalogo.html" class="btn btn-primario" style="margin-top:16px;">Ver catálogo</a>
      </div>
    `;
    return;
  }

  area.innerHTML = pedidos.map(p => {
    const status = STATUS_INFO[p.status] || STATUS_INFO.aguardando_confirmacao;
    return `
      <div class="cartao pedido-cartao">
        <div class="pedido-icone"><span class="material-symbols-outlined">${status.icone}</span></div>
        <div>
          <div class="pedido-numero">Pedido #${p.id.slice(0,8).toUpperCase()}</div>
          <div class="pedido-detalhes">${formatarData(p.data_agendada)} às ${p.horario_agendado} · ${p.tipo_entrega === 'entrega' ? 'Entrega' : 'Retirada'}</div>
          <div class="pedido-itens-mini">${p.itens.map(i => `${i.quantidade}x ${i.nome}`).join(', ')}</div>
        </div>
        <div class="pedido-lado-direito">
          <div class="pedido-preco">${formatarPreco(p.valor_total)}</div>
          <span class="badge ${status.classe}">${status.rotulo}</span>
        </div>
      </div>
    `;
  }).join('');
}

carregarPedidos();
</script>
</body>
</html>
