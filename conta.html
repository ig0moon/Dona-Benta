<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha Conta — Dona Benta</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="css/style.css">
<style>
  .conta-layout {
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 28px;
    padding: 32px 0 80px;
    align-items: flex-start;
  }
  @media (max-width: 800px) { .conta-layout { grid-template-columns: 1fr; } }

  .conta-perfil-topo { text-align: center; margin-bottom: 20px; }
  .conta-avatar {
    width: 76px; height: 76px;
    border-radius: 50%;
    background: var(--azul-bebe);
    color: var(--marrom);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    margin: 0 auto 12px;
  }
  .conta-menu a {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-radius: var(--raio-sm);
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--marrom-claro);
    margin-bottom: 4px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .conta-menu a:hover, .conta-menu a.ativo {
    background: var(--azul-bebe);
    color: var(--marrom);
  }
  .conta-menu a.sair { color: var(--erro); margin-top: 12px; }
  .conta-menu a.sair:hover { background: rgba(217,108,108,0.1); }

  .conta-menu-admin {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(107,66,38,0.1);
  }
</style>
</head>
<body>

<section class="pagina-header">
  <div class="container">
    <span class="eyebrow">Minha conta</span>
    <h1>Olá!</h1>
    <p>Gerencie seus dados pessoais e acompanhe seus pedidos.</p>
  </div>
</section>

<div class="container">
  <div class="conta-layout" id="contaLayout">
    <div class="spinner"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/layout.js"></script>
<script>
async function carregarConta() {
  const usuario = await exigirLogin('login.html');
  if (!usuario) return;

  const perfil = await perfilAtual();
  const layout = document.getElementById('contaLayout');

  const nome = perfil?.nome || 'Cliente';
  const inicial = nome.charAt(0).toUpperCase();

  layout.innerHTML = `
    <div class="cartao">
      <div class="conta-perfil-topo">
        <div class="conta-avatar">${inicial}</div>
        <h3 style="font-size: 1.1rem;">${nome}</h3>
        <p style="font-size: 0.85rem; color: var(--marrom-claro);">${usuario.email}</p>
      </div>
      <nav class="conta-menu">
        <a href="conta.html" class="ativo"><span class="material-symbols-outlined">person</span> Meus dados</a>
        <a href="pedidos-lista.html"><span class="material-symbols-outlined">receipt_long</span> Meus pedidos</a>
        <a href="carrinho.html"><span class="material-symbols-outlined">shopping_bag</span> Carrinho</a>
        ${perfil?.role === 'admin' ? `
          <div class="conta-menu-admin">
            <a href="admin.html"><span class="material-symbols-outlined">admin_panel_settings</span> Área administrativa</a>
          </div>
        ` : ''}
        <a href="#" id="btnSair" class="sair"><span class="material-symbols-outlined">logout</span> Sair da conta</a>
      </nav>
    </div>

    <div class="cartao">
      <h3 style="margin-bottom: 20px;">Meus dados</h3>
      <form id="formPerfil">
        <div class="campo-linha">
          <div class="campo">
            <label for="nomePerfil">Nome completo</label>
            <input type="text" id="nomePerfil" value="${perfil?.nome || ''}" required>
          </div>
          <div class="campo">
            <label for="telefonePerfil">Telefone / WhatsApp</label>
            <input type="tel" id="telefonePerfil" value="${perfil?.telefone || ''}" required>
          </div>
        </div>
        <div class="campo">
          <label for="emailPerfil">E-mail</label>
          <input type="email" id="emailPerfil" value="${usuario.email}" disabled>
        </div>
        <div class="campo-linha">
          <div class="campo">
            <label for="cepPerfil">CEP</label>
            <input type="text" id="cepPerfil" value="${perfil?.cep || ''}" placeholder="00000-000">
          </div>
          <div class="campo">
            <label for="bairroPerfil">Bairro</label>
            <input type="text" id="bairroPerfil" value="${perfil?.bairro || ''}">
          </div>
        </div>
        <div class="campo-linha">
          <div class="campo">
            <label for="logradouroPerfil">Rua</label>
            <input type="text" id="logradouroPerfil" value="${perfil?.logradouro || ''}">
          </div>
          <div class="campo">
            <label for="numeroPerfil">Número</label>
            <input type="text" id="numeroPerfil" value="${perfil?.numero || ''}">
          </div>
        </div>
        <div class="campo">
          <label for="complementoPerfil">Complemento</label>
          <input type="text" id="complementoPerfil" value="${perfil?.complemento || ''}" placeholder="Apto, bloco, referência...">
        </div>
        <button type="submit" class="btn btn-primario" id="btnSalvarPerfil">
          <span class="material-symbols-outlined">save</span>
          Salvar alterações
        </button>
      </form>
    </div>
  `;

  document.getElementById('formPerfil').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('btnSalvarPerfil');
    btn.disabled = true;

    const dadosAtualizados = {
      nome: document.getElementById('nomePerfil').value,
      telefone: document.getElementById('telefonePerfil').value,
      cep: document.getElementById('cepPerfil').value,
      bairro: document.getElementById('bairroPerfil').value,
      logradouro: document.getElementById('logradouroPerfil').value,
      numero: document.getElementById('numeroPerfil').value,
      complemento: document.getElementById('complementoPerfil').value,
    };

    const { error } = await db.from('perfis').update(dadosAtualizados).eq('id', usuario.id);
    btn.disabled = false;

    if (error) {
      mostrarToast('Erro ao salvar dados', 'erro');
    } else {
      mostrarToast('Dados atualizados com sucesso!', 'sucesso');
    }
  });

  document.getElementById('btnSair').addEventListener('click', async (e) => {
    e.preventDefault();
    await db.auth.signOut();
    window.location.href = 'index.html';
  });
}

carregarConta();
</script>
</body>
</html>
