<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><title>Entrar — Dona Benta</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<section class="auth-secao"><div class="container"><div class="cartao auth-cartao" id="authContent">
    <div class="auth-topo">
        <span class="material-symbols-outlined">bakery_dining</span>
        <h1>Bem-vindo(a)</h1>
        <p>Entre ou crie sua conta</p>
    </div>
    <div class="auth-abas">
        <button class="auth-aba ativa" id="abaEntrar">Entrar</button>
        <button class="auth-aba" id="abaCadastrar">Criar conta</button>
    </div>
    <form class="form-auth ativo" id="formEntrar">
        <div class="campo"><label>E-mail</label><input type="email" id="emailEntrar" required></div>
        <div class="campo"><label>Senha</label><input type="password" id="senhaEntrar" required></div>
        <div class="senha-esqueci"><a href="#" id="linkEsqueciSenha">Esqueci minha senha</a></div>
        <button type="submit" class="btn btn-primario btn-bloco" id="btnEntrar">Entrar</button>
    </form>
    <form class="form-auth" id="formCadastrar">
        <div class="campo"><label>Nome</label><input type="text" id="nomeCadastro" required></div>
        <div class="campo"><label>Telefone</label><input type="tel" id="telefoneCadastro" required></div>
        <div class="campo"><label>E-mail</label><input type="email" id="emailCadastro" required></div>
        <div class="campo"><label>Senha</label><input type="password" id="senhaCadastro" required></div>
        <button type="submit" class="btn btn-primario btn-bloco" id="btnCadastrar">Criar conta</button>
    </form>
</div></div></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/layout.js"></script>
<script src="js/login.js"></script>
</body>
</html>
