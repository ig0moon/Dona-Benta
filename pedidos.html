<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finalizar Pedido — Dona Benta</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="css/style.css">
<style>
  .etapas {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 32px 0 8px;
    flex-wrap: wrap;
  }
  .etapa {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--branco);
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--marrom-claro);
    box-shadow: var(--sombra-suave);
  }
  .etapa.ativa { background: var(--dourado-escuro); color: var(--branco); }
  .etapa.concluida { background: var(--azul-bebe); color: var(--marrom); }
  .etapa .material-symbols-outlined { font-size: 18px; }

  .checkout-layout {
    display: grid;
    grid-template-columns: 1.6fr 1fr;
    gap: 32px;
    align-items: flex-start;
    padding: 32px 0 80px;
  }
  @media (max-width: 860px) { .checkout-layout { grid-template-columns: 1fr; } }

  .tipo-entrega-opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
  @media (max-width: 500px) { .tipo-entrega-opcoes { grid-template-columns: 1fr; } }
  .opcao-entrega {
    border: 2px solid rgba(107,66,38,0.12);
    border-radius: var(--raio-md);
    padding: 18px;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
    text-align: center;
  }
  .opcao-entrega.selecionada { border-color: var(--dourado-escuro); background: rgba(242,166,90,0.08); }
  .opcao-entrega .material-symbols-outlined { font-size: 30px; color: var(--dourado-escuro); margin-bottom: 6px; }
  .opcao-entrega h4 { font-family: var(--fonte-corpo); font-size: 0.95rem; color: var(--marrom); }

  /* Calendário estilo GTK */
  .calendario-cartao { margin-bottom: 20px; }
  .calendario-cabecalho {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .calendario-cabecalho button {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--creme-escuro);
    color: var(--marrom);
    display: flex; align-items: center; justify-content: center;
  }
  .calendario-cabecalho button:hover { background: var(--azul-bebe); }
  .calendario-mes { font-weight: 700; color: var(--marrom); text-transform: capitalize; }
  .calendario-grade-dias {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
    text-align: center;
    font-size: 0.78rem;
    color: var(--marrom-claro);
    margin-bottom: 6px;
  }
  .calendario-grade-datas {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .data-celula {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 10px;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--texto);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .data-celula.vazia { visibility: hidden; }
  .data-celula.passada { color: rgba(61,61,61,0.25); cursor: not-allowed; }
  .data-celula:not(.vazia):not(.passada):hover { background: var(--azul-bebe); }
  .data-celula.selecionada { background: var(--dourado-escuro); color: var(--branco); }

  .horarios-grade {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 14px;
  }
  @media (max-width: 480px) { .horarios-grade { grid-template-columns: repeat(2, 1fr); } }
  .horario-btn {
    padding: 10px;
    border-radius: var(--raio-sm);
    background: var(--creme-escuro);
    color: var(--marrom);
    font-weight: 600;
    font-size: 0.85rem;
    text-align: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .horario-btn:hover:not(:disabled) { background: var(--azul-bebe); }
  .horario-btn.selecionado { background: var(--dourado-escuro); color: var(--branco); }
  .horario-btn:disabled { opacity: 0.35; cursor: not-allowed; text-decoration: line-through; }

  .resumo-linha {
    display: flex; justify-content: space-between;
    padding: 8px 0;
    font-size: 0.92rem;
    color: var(--marrom-claro);
  }
  .resumo-linha.total {
    border-top: 1px solid rgba(107,66,38,0.12);
    margin-top: 8px; padding-top: 16px;
    font-weight: 700; color: var(--marrom); font-size: 1.1rem;
  }
  .resumo-linha.total span:last-child { color: var(--dourado-escuro); font-family: var(--fonte-display); }
  .resumo-item-mini { font-size: 0.85rem; color: var(--marrom-claro); padding: 4px 0; display: flex; justify-content: space-between; }

  /* Recibo (modal) */
  .recibo-overlay {
    position: fixed; inset: 0;
    background: rgba(61,61,61,0.5);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .recibo-overlay.aberto { display: flex; }
  .recibo-cartao {
    background: var(--branco);
    border-radius: var(--raio-lg);
    max-width: 460px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
  }
  .recibo-topo { text-align: center; margin-bottom: 20px; }
  .recibo-topo .material-symbols-outlined {
    font-size: 48px; color: var(--sucesso);
    background: rgba(111,169,126,0.12);
    width: 80px; height: 80px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .recibo-linha-detalhe {
    display: flex; justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px dashed rgba(107,66,38,0.14);
    font-size: 0.9rem;
  }
  .recibo-linha-detalhe span:first-child { color: var(--marrom-claro); }
  .recibo-linha-detalhe span:last-child { font-weight: 600; color: var(--marrom); text-align: right; }
  .recibo-acoes { display: flex; flex-direction: column; gap: 10px; margin-top: 24px; }
</style>
</head>
<body>

<section class="pagina-header">
  <div class="container">
    <span class="eyebrow">Finalizar pedido</span>
    <h1>Agende seu pedido</h1>
    <p>Escolha entre retirada ou entrega, o melhor dia e horário para você.</p>
  </div>
</section>

<div class="container">
  <div class="etapas">
    <div class="etapa concluida"><span class="material-symbols-outlined">shopping_bag</span> Carrinho</div>
    <div class="etapa ativa"><span class="material-symbols-outlined">event</span> Agendamento</div>
    <div class="etapa"><span class="material-symbols-outlined">receipt_long</span> Confirmação</div>
  </div>

  <div class="checkout-layout" id="checkoutLayout">
    <div class="spinner"></div>
  </div>
</div>

<!-- Recibo -->
<div class="recibo-overlay" id="reciboOverlay">
  <div class="recibo-cartao">
    <div class="recibo-topo">
      <span class="material-symbols-outlined">task_alt</span>
      <h2 style="font-size: 1.4rem;">Pedido registrado!</h2>
      <p style="color: var(--marrom-claro); font-size: 0.9rem;">Confira o recibo abaixo e confirme pelo WhatsApp.</p>
    </div>
    <div id="reciboConteudo"></div>
    <div class="recibo-acoes">
      <a href="#" id="btnWhatsapp" class="btn btn-whatsapp btn-bloco" target="_blank" rel="noopener">
        <span class="material-symbols-outlined">chat</span>
        Confirmar no WhatsApp
      </a>
      <a href="conta.html?aba=pedidos" class="btn btn-outline btn-bloco" id="btnVerPedidos">Ver meus pedidos</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/layout.js"></script>
<script src="js/pedidos.js"></script>
</body>
</html>
