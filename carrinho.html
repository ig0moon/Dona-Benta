<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho — Dona Benta</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="css/style.css">
<style>
  .carrinho-layout {
    display: grid;
    grid-template-columns: 1.7fr 1fr;
    gap: 32px;
    align-items: flex-start;
    padding: 40px 0 80px;
  }
  @media (max-width: 860px) {
    .carrinho-layout { grid-template-columns: 1fr; }
  }

  .item-carrinho {
    display: grid;
    grid-template-columns: 90px 1fr auto auto;
    gap: 18px;
    align-items: center;
    padding: 18px 0;
    border-bottom: 1px solid rgba(107,66,38,0.1);
  }
  .item-carrinho:last-child { border-bottom: none; }
  .item-imagem {
    width: 90px; height: 90px;
    border-radius: var(--raio-sm);
    overflow: hidden;
  }
  .item-imagem img { width: 100%; height: 100%; object-fit: cover; }
  .item-nome { font-weight: 600; color: var(--marrom); margin-bottom: 4px; }
  .item-preco-unit { font-size: 0.85rem; color: var(--marrom-claro); }

  .item-quantidade {
    display: flex;
    align-items: center;
    background: var(--creme-escuro);
    border-radius: 999px;
    overflow: hidden;
  }
  .item-quantidade button {
    width: 34px; height: 34px;
    background: transparent;
    display: flex; align-items: center; justify-content: center;
    color: var(--marrom);
  }
  .item-quantidade button:hover { background: var(--azul-bebe); }
  .item-quantidade span { min-width: 28px; text-align: center; font-weight: 700; font-size: 0.9rem; }

  .item-remover {
    color: var(--erro);
    display: flex; align-items: center; justify-content: center;
    width: 36px; height: 36px;
    border-radius: 50%;
    transition: background 0.2s ease;
  }
  .item-remover:hover { background: rgba(217,108,108,0.12); }

  @media (max-width: 560px) {
    .item-carrinho { grid-template-columns: 60px 1fr; grid-template-rows: auto auto; }
    .item-quantidade, .item-remover { grid-column: 2; justify-self: start; }
  }

  .resumo-cartao { position: sticky; top: 100px; }
  .resumo-linha {
    display: flex; justify-content: space-between;
    padding: 10px 0;
    font-size: 0.95rem;
    color: var(--marrom-claro);
  }
  .resumo-linha.total {
    border-top: 1px solid rgba(107,66,38,0.12);
    margin-top: 8px;
    padding-top: 16px;
    font-weight: 700;
    color: var(--marrom);
    font-size: 1.15rem;
  }
  .resumo-linha.total span:last-child { color: var(--dourado-escuro); font-family: var(--fonte-display); }
</style>
</head>
<body>

<section class="pagina-header">
  <div class="container">
    <span class="eyebrow">Seu carrinho</span>
    <h1>Revise seu pedido</h1>
    <p>Confira os itens antes de seguir para o agendamento e confirmação.</p>
  </div>
</section>

<div class="container">
  <div class="carrinho-layout" id="carrinhoLayout">
    <div class="spinner"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/layout.js"></script>
</body>
</html>
