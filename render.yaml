# Blueprint do Render para o Dona Benta.
# Os valores marcados com "sync: false" são segredos: o Render pede para você
# digitá-los no painel (nunca coloque senhas ou tokens neste arquivo).
services:
  - type: web
    name: dona-benta
    runtime: docker
    plan: starter # sempre ligado (o plano free "dorme" após 15 min sem acesso)
    healthCheckPath: /api/health
    envVars:
      - key: CI_ENVIRONMENT
        value: production
      - key: TRUST_TRUE_CLIENT_IP
        value: "true"
      - key: DB_ENCRYPT
        value: "true"
      - key: APP_BASE_URL # ex.: https://www.seudominio.com.br/ (domínio final)
        sync: false
      - key: WEBHOOK_URL # ex.: https://www.seudominio.com.br/api/webhook/mercadopago
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET # "assinatura secreta" do webhook, no painel do Mercado Pago
        sync: false
      - key: LOJA_RAZAO_SOCIAL # razão social exibida no rodapé e nos textos legais
        sync: false
      - key: LOJA_CNPJ # ex.: 00.000.000/0000-00
        sync: false
      - key: LOJA_EMAIL # e-mail de atendimento e privacidade (não use @donabenta.com.br)
        sync: false
