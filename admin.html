<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo — Dona Benta</title>
<link href="https://fonts.googleapis.com/icon?family=Material+Symbols+Outlined" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
<link rel="stylesheet" href="css/style.css">
<style>
  .admin-layout {
    display: grid;
    grid-template-columns: 240px 1fr;
    gap: 28px;
    padding: 32px 0 80px;
    align-items: flex-start;
  }
  @media (max-width: 800px) { .admin-layout { grid-template-columns: 1fr; } }

  .admin-menu a {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 14px;
    border-radius: var(--raio-sm);
    font-weight: 600;
    font-size: 0.92rem;
    color: var(--marrom-claro);
    margin-bottom: 4px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .admin-menu a:hover, .admin-menu a.ativo { background: var(--azul-bebe); color: var(--marrom); }

  .admin-secao { display: none; }
  .admin-secao.ativa { display: block; }

  .stats-grade {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
    margin-bottom: 28px;
  }
  @media (max-width: 900px) { .stats-grade { grid-template-columns: repeat(2, 1fr); } }
  .stat-cartao { text-align: center; padding: 22px; }
  .stat-cartao .material-symbols-outlined { font-size: 30px; color: var(--dourado-escuro); margin-bottom: 8px; }
  .stat-valor { font-family: var(--fonte-display); font-size: 1.6rem; font-weight: 700; color: var(--marrom); }
  .stat-rotulo { font-size: 0.85rem; color: var(--marrom-claro); }

  .tabela-topo {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .tabela-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 640px; }
  th {
    text-align: left;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--marrom-claro);
    padding: 12px;
    border-bottom: 2px solid rgba(107,66,38,0.1);
  }
  td { padding: 14px 12px; border-bottom: 1px solid rgba(107,66,38,0.08); font-size: 0.92rem; vertical-align: middle; }
  .tabela-produto-cel { display: flex; align-items: center; gap: 12px; }
  .tabela-produto-cel img { width: 44px; height: 44px; border-radius: 10px; object-fit: cover; }

  .acoes-tabela { display: flex; gap: 6px; }
  .acao-icone-btn {
    width: 34px; height: 34px;
    border-radius: 8px;
    background: var(--creme-escuro);
    color: var(--marrom);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease;
  }
  .acao-icone-btn:hover { background: var(--azul-bebe); }
  .acao-icone-btn.excluir:hover { background: rgba(217,108,108,0.15); color: var(--erro); }

  select.status-select {
    padding: 6px 10px;
    border-radius: 8px;
    border: 1px solid rgba(107,66,38,0.15);
    font-size: 0.85rem;
    font-weight: 600;
    background: var(--branco);
  }

  /* Modal produto */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(61,61,61,0.5);
    display: none;
    align-items: center; justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay.aberto { display: flex; }
  .modal-cartao {
    background: var(--branco);
    border-radius: var(--raio-lg);
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    padding: 32px;
  }
  .modal-cabecalho {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 22px;
  }
  .modal-fechar {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--creme-escuro);
    display: flex; align-items: center; justify-content: center;
    color: var(--marrom);
  }
</style>
</head>
<body>

<section class="pagina-header">
  <div class="container">
    <span class="eyebrow">Área administrativa</span>
    <h1>Painel Dona Benta</h1>
    <p>Gerencie produtos e acompanhe pedidos.</p>
  </div>
</section>

<div class="container">
  <div class="admin-layout" id="adminLayout">
    <div class="spinner"></div>
  </div>
</div>

<!-- Modal de produto -->
<div class="modal-overlay" id="modalProduto">
  <div class="modal-cartao">
    <div class="modal-cabecalho">
      <h3 id="modalTitulo">Novo produto</h3>
      <button class="modal-fechar" id="fecharModal"><span class="material-symbols-outlined">close</span></button>
    </div>
    <form id="formProduto">
      <input type="hidden" id="produtoId">
      <div class="campo">
        <label for="produtoNome">Nome do produto</label>
        <input type="text" id="produtoNome" required>
      </div>
      <div class="campo">
        <label for="produtoCategoria">Categoria</label>
        <select id="produtoCategoria" required>
          <option value="bolos">Bolos</option>
          <option value="paes">Pães</option>
          <option value="doces">Doces</option>
          <option value="salgados">Salgados</option>
          <option value="tortas">Tortas</option>
        </select>
      </div>
      <div class="campo-linha">
        <div class="campo">
          <label for="produtoPreco">Preço (R$)</label>
          <input type="number" id="produtoPreco" step="0.01" min="0" required>
        </div>
        <div class="campo">
          <label for="produtoEstoque">Estoque</label>
          <input type="number" id="produtoEstoque" min="0" required>
        </div>
      </div>
      <div class="campo">
        <label for="produtoImagem">URL da imagem</label>
        <input type="url" id="produtoImagem" placeholder="https://..." required>
      </div>
      <div class="campo">
        <label for="produtoDescricaoCurta">Descrição curta (usada no carrossel)</label>
        <textarea id="produtoDescricaoCurta" rows="2" required></textarea>
      </div>
      <div class="campo">
        <label for="produtoDescricao">Descrição completa</label>
        <textarea id="produtoDescricao" rows="4" required></textarea>
      </div>
      <div class="campo-linha">
        <div class="campo" style="display:flex; align-items:center; gap:8px; margin-top: 26px;">
          <input type="checkbox" id="produtoDisponivel" style="width:auto;" checked>
          <label for="produtoDisponivel" style="margin:0;">Disponível</label>
        </div>
        <div class="campo" style="display:flex; align-items:center; gap:8px; margin-top: 26px;">
          <input type="checkbox" id="produtoDestaque" style="width:auto;">
          <label for="produtoDestaque" style="margin:0;">Destaque (carrossel)</label>
        </div>
      </div>
      <button type="submit" class="btn btn-primario btn-bloco" id="btnSalvarProduto">
        <span class="material-symbols-outlined">save</span>
        Salvar produto
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-client.js"></script>
<script src="js/carrinho.js"></script>
<script src="js/layout.js"></script>
<script>
const STATUS_INFO = {
  aguardando_confirmacao: { rotulo: 'Aguardando', classe: 'badge-alerta' },
  confirmado: { rotulo: 'Confirmado', classe: 'badge-info' },
  em_preparo: { rotulo: 'Em preparo', classe: 'badge-info' },
  pronto: { rotulo: 'Pronto', classe: 'badge-sucesso' },
  entregue: { rotulo: 'Entregue', classe: 'badge-sucesso' },
  cancelado: { rotulo: 'Cancelado', classe: 'badge-erro' },
};

let PRODUTOS_ADMIN = [];
let PEDIDOS_ADMIN = [];

async function iniciarAdmin() {
  const perfil = await exigirAdmin();
  if (!perfil) return;

  await Promise.all([carregarProdutosAdmin(), carregarPedidosAdmin()]);
  montarLayoutAdmin();
}

async function carregarProdutosAdmin() {
  try {
    const { data, error } = await db.from('produtos').select('*').order('criado_em', { ascending: false });
    if (!error && data) PRODUTOS_ADMIN = data;
  } catch (e) {
    console.warn('Supabase não configurado — painel de produtos vazio até a configuração.');
  }
}

async function carregarPedidosAdmin() {
  try {
    const { data, error } = await db.from('pedidos').select('*, perfis(nome, telefone)').order('criado_em', { ascending: false });
    if (!error && data) PEDIDOS_ADMIN = data;
  } catch (e) {
    console.warn('Supabase não configurado — painel de pedidos vazio até a configuração.');
  }
}

function montarLayoutAdmin() {
  const layout = document.getElementById('adminLayout');
  layout.innerHTML = `
    <nav class="cartao admin-menu">
      <a href="#" data-secao="visao-geral" class="ativo"><span class="material-symbols-outlined">dashboard</span> Visão geral</a>
      <a href="#" data-secao="produtos"><span class="material-symbols-outlined">bakery_dining</span> Produtos</a>
      <a href="#" data-secao="pedidos"><span class="material-symbols-outlined">receipt_long</span> Pedidos</a>
      <a href="index.html" style="margin-top:12px;"><span class="material-symbols-outlined">arrow_back</span> Voltar ao site</a>
    </nav>

    <div>
      <section class="admin-secao ativa" id="secaoVisaoGeral"></section>
      <section class="admin-secao" id="secaoProdutos"></section>
      <section class="admin-secao" id="secaoPedidos"></section>
    </div>
  `;

  document.querySelectorAll('.admin-menu a[data-secao]').forEach(link => {
    link.addEventListener('click', (e) => {
      e.preventDefault();
      document.querySelectorAll('.admin-menu a').forEach(l => l.classList.remove('ativo'));
      link.classList.add('ativo');
      document.querySelectorAll('.admin-secao').forEach(s => s.classList.remove('ativa'));
      const mapa = { 'visao-geral': 'secaoVisaoGeral', 'produtos': 'secaoProdutos', 'pedidos': 'secaoPedidos' };
      document.getElementById(mapa[link.dataset.secao]).classList.add('ativa');
    });
  });

  renderizarVisaoGeral();
  renderizarProdutos();
  renderizarPedidos();
}

function renderizarVisaoGeral() {
  const totalPedidos = PEDIDOS_ADMIN.length;
  const pendentes = PEDIDOS_ADMIN.filter(p => p.status === 'aguardando_confirmacao').length;
  const faturamento = PEDIDOS_ADMIN.filter(p => p.status !== 'cancelado').reduce((s, p) => s + Number(p.valor_total), 0);
  const totalProdutos = PRODUTOS_ADMIN.length;

  document.getElementById('secaoVisaoGeral').innerHTML = `
    <div class="stats-grade">
      <div class="cartao stat-cartao">
        <span class="material-symbols-outlined">receipt_long</span>
        <div class="stat-valor">${totalPedidos}</div>
        <div class="stat-rotulo">Pedidos totais</div>
      </div>
      <div class="cartao stat-cartao">
        <span class="material-symbols-outlined">hourglass_empty</span>
        <div class="stat-valor">${pendentes}</div>
        <div class="stat-rotulo">Aguardando confirmação</div>
      </div>
      <div class="cartao stat-cartao">
        <span class="material-symbols-outlined">payments</span>
        <div class="stat-valor">${formatarPreco(faturamento)}</div>
        <div class="stat-rotulo">Faturamento total</div>
      </div>
      <div class="cartao stat-cartao">
        <span class="material-symbols-outlined">bakery_dining</span>
        <div class="stat-valor">${totalProdutos}</div>
        <div class="stat-rotulo">Produtos cadastrados</div>
      </div>
    </div>
    <div class="cartao">
      <h3 style="margin-bottom:16px;">Últimos pedidos</h3>
      ${PEDIDOS_ADMIN.length === 0 ? '<p style="color:var(--marrom-claro);">Nenhum pedido registrado ainda.</p>' : `
        <div class="tabela-scroll">
          <table>
            <thead><tr><th>Cliente</th><th>Itens</th><th>Data</th><th>Total</th><th>Status</th></tr></thead>
            <tbody>
              ${PEDIDOS_ADMIN.slice(0, 5).map(p => `
                <tr>
                  <td>${p.perfis?.nome || '—'}</td>
                  <td>${p.itens.length} item(ns)</td>
                  <td>${formatarData(p.data_agendada)}</td>
                  <td>${formatarPreco(p.valor_total)}</td>
                  <td><span class="badge ${STATUS_INFO[p.status]?.classe || 'badge-info'}">${STATUS_INFO[p.status]?.rotulo || p.status}</span></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;
}

function renderizarProdutos() {
  const secao = document.getElementById('secaoProdutos');
  secao.innerHTML = `
    <div class="cartao">
      <div class="tabela-topo">
        <h3>Produtos (${PRODUTOS_ADMIN.length})</h3>
        <button class="btn btn-primario" id="btnNovoProduto">
          <span class="material-symbols-outlined">add</span> Novo produto
        </button>
      </div>
      ${PRODUTOS_ADMIN.length === 0 ? `
        <div class="vazio">
          <span class="material-symbols-outlined">bakery_dining</span>
          <h3>Nenhum produto cadastrado</h3>
          <p>Clique em "Novo produto" para adicionar o primeiro item do catálogo.</p>
        </div>
      ` : `
        <div class="tabela-scroll">
          <table>
            <thead><tr><th>Produto</th><th>Categoria</th><th>Preço</th><th>Estoque</th><th>Status</th><th>Ações</th></tr></thead>
            <tbody>
              ${PRODUTOS_ADMIN.map(p => `
                <tr>
                  <td>
                    <div class="tabela-produto-cel">
                      <img src="${p.imagem_url}" alt="${p.nome}">
                      <span>${p.nome}</span>
                    </div>
                  </td>
                  <td>${p.categoria}</td>
                  <td>${formatarPreco(p.preco)}</td>
                  <td>${p.estoque ?? '—'}</td>
                  <td><span class="badge ${p.disponivel ? 'badge-sucesso' : 'badge-erro'}">${p.disponivel ? 'Disponível' : 'Indisponível'}</span></td>
                  <td>
                    <div class="acoes-tabela">
                      <button class="acao-icone-btn" data-editar="${p.id}" aria-label="Editar"><span class="material-symbols-outlined">edit</span></button>
                      <button class="acao-icone-btn excluir" data-excluir="${p.id}" aria-label="Excluir"><span class="material-symbols-outlined">delete</span></button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  document.getElementById('btnNovoProduto').addEventListener('click', () => abrirModalProduto());
  secao.querySelectorAll('[data-editar]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalProduto(btn.dataset.editar));
  });
  secao.querySelectorAll('[data-excluir]').forEach(btn => {
    btn.addEventListener('click', () => excluirProduto(btn.dataset.excluir));
  });
}

function renderizarPedidos() {
  const secao = document.getElementById('secaoPedidos');
  secao.innerHTML = `
    <div class="cartao">
      <div class="tabela-topo">
        <h3>Pedidos (${PEDIDOS_ADMIN.length})</h3>
      </div>
      ${PEDIDOS_ADMIN.length === 0 ? `
        <div class="vazio">
          <span class="material-symbols-outlined">receipt_long</span>
          <h3>Nenhum pedido ainda</h3>
          <p>Os pedidos feitos pelos clientes vão aparecer aqui.</p>
        </div>
      ` : `
        <div class="tabela-scroll">
          <table>
            <thead><tr><th>Cliente</th><th>Itens</th><th>Data / Hora</th><th>Tipo</th><th>Total</th><th>Status</th></tr></thead>
            <tbody>
              ${PEDIDOS_ADMIN.map(p => `
                <tr>
                  <td>${p.perfis?.nome || '—'}<br><span style="color:var(--marrom-claro); font-size:0.8rem;">${p.perfis?.telefone || ''}</span></td>
                  <td style="max-width:220px;">${p.itens.map(i => `${i.quantidade}x ${i.nome}`).join(', ')}</td>
                  <td>${formatarData(p.data_agendada)}<br>${p.horario_agendado}</td>
                  <td>${p.tipo_entrega === 'entrega' ? 'Entrega' : 'Retirada'}</td>
                  <td>${formatarPreco(p.valor_total)}</td>
                  <td>
                    <select class="status-select" data-pedido="${p.id}">
                      ${Object.entries(STATUS_INFO).map(([valor, info]) =>
                        `<option value="${valor}" ${p.status === valor ? 'selected' : ''}>${info.rotulo}</option>`
                      ).join('')}
                    </select>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `}
    </div>
  `;

  secao.querySelectorAll('.status-select').forEach(sel => {
    sel.addEventListener('change', async () => {
      const { error } = await db.from('pedidos').update({ status: sel.value }).eq('id', sel.dataset.pedido);
      if (error) {
        mostrarToast('Erro ao atualizar status', 'erro');
      } else {
        mostrarToast('Status do pedido atualizado', 'sucesso');
        const pedido = PEDIDOS_ADMIN.find(p => p.id === sel.dataset.pedido);
        if (pedido) pedido.status = sel.value;
        renderizarVisaoGeral();
      }
    });
  });
}

function abrirModalProduto(id = null) {
  const modal = document.getElementById('modalProduto');
  const form = document.getElementById('formProduto');
  form.reset();

  if (id) {
    const produto = PRODUTOS_ADMIN.find(p => p.id === id);
    document.getElementById('modalTitulo').textContent = 'Editar produto';
    document.getElementById('produtoId').value = produto.id;
    document.getElementById('produtoNome').value = produto.nome;
    document.getElementById('produtoCategoria').value = produto.categoria;
    document.getElementById('produtoPreco').value = produto.preco;
    document.getElementById('produtoEstoque').value = produto.estoque ?? 0;
    document.getElementById('produtoImagem').value = produto.imagem_url;
    document.getElementById('produtoDescricaoCurta').value = produto.descricao_curta || '';
    document.getElementById('produtoDescricao').value = produto.descricao || '';
    document.getElementById('produtoDisponivel').checked = produto.disponivel !== false;
    document.getElementById('produtoDestaque').checked = !!produto.destaque;
  } else {
    document.getElementById('modalTitulo').textContent = 'Novo produto';
    document.getElementById('produtoId').value = '';
    document.getElementById('produtoDisponivel').checked = true;
  }

  modal.classList.add('aberto');
}

document.getElementById('fecharModal').addEventListener('click', () => {
  document.getElementById('modalProduto').classList.remove('aberto');
});

document.getElementById('formProduto').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btnSalvarProduto');
  btn.disabled = true;

  const id = document.getElementById('produtoId').value;
  const dadosProduto = {
    nome: document.getElementById('produtoNome').value,
    categoria: document.getElementById('produtoCategoria').value,
    preco: Number(document.getElementById('produtoPreco').value),
    estoque: Number(document.getElementById('produtoEstoque').value),
    imagem_url: document.getElementById('produtoImagem').value,
    descricao_curta: document.getElementById('produtoDescricaoCurta').value,
    descricao: document.getElementById('produtoDescricao').value,
    disponivel: document.getElementById('produtoDisponivel').checked,
    destaque: document.getElementById('produtoDestaque').checked,
  };

  let erro;
  if (id) {
    ({ error: erro } = await db.from('produtos').update(dadosProduto).eq('id', id));
  } else {
    ({ error: erro } = await db.from('produtos').insert(dadosProduto));
  }

  btn.disabled = false;

  if (erro) {
    mostrarToast('Erro ao salvar produto', 'erro');
    return;
  }

  mostrarToast(id ? 'Produto atualizado!' : 'Produto criado!', 'sucesso');
  document.getElementById('modalProduto').classList.remove('aberto');
  await carregarProdutosAdmin();
  renderizarProdutos();
  renderizarVisaoGeral();
});

async function excluirProduto(id) {
  if (!confirm('Tem certeza que deseja excluir este produto?')) return;

  const { error } = await db.from('produtos').delete().eq('id', id);
  if (error) {
    mostrarToast('Erro ao excluir produto', 'erro');
    return;
  }

  mostrarToast('Produto excluído', 'sucesso');
  await carregarProdutosAdmin();
  renderizarProdutos();
  renderizarVisaoGeral();
}

iniciarAdmin();
</script>
</body>
</html>
